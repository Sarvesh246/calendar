name: Push dispatch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          url="https://datebookcalendar.vercel.app/api/push/dispatch"
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$url"
          else
            curl -fsS "$url"
          fi
