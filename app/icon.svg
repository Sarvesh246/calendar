  <rect x="303" y="144" width="18" height="48" rx="9" fill="#FFFFFF" />
  <rect x="144" y="168" width="224" height="204" rx="26" fill="#FFFFFF" />

  <path
    d="M186 280 L234 328 L326 232"
    stroke="#0B0B0D"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
